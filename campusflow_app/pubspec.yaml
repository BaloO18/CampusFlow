name: campusflow
description: "CampusFlow : suivre ses échéances académiques en une seule liste."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  campusflow_models:
    path: ../campusflow_models
  flutter_svg: ^2.5.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
